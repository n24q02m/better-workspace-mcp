name: Bot PR Governance

on:
  pull_request:
    types:
      - opened
  workflow_dispatch:
    inputs:
      dry_run:
        description: Read-only governance observation; manual runs never mutate pull requests
        required: false
        default: true
        type: boolean

permissions: {}

jobs:
  governance:
    name: Bot PR Rate Limit & Duplicate Check
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Detect and govern internal bot PRs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.head_ref }}
          ACTOR: ${{ github.actor }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Keep this defense in depth with the job-level expression above. A fork must
          # never reach a mutating command, even if the workflow is changed later.
          if [[ "$HEAD_REPO" != "$REPO" ]]; then
            echo "External PR repository $HEAD_REPO is outside governance scope; skipping."
            exit 0
          fi

          BOT_PATTERN='^(bolt[-/]|palette-ux-|fix/web-scraper-|jules[-/])|-[0-9]{14,}$'

          if [[ ! "$BRANCH" =~ ^(bolt[-/]|palette-ux-|fix/web-scraper-|jules[-/]) ]] &&
             [[ ! "$BRANCH" =~ -[0-9]{14,}$ ]]; then
            echo "Not a bot PR ($BRANCH), skipping governance checks."
            exit 0
          fi

          echo "Bot PR detected on internal branch: $BRANCH"
          gh pr edit "$PR_NUMBER" --add-label "bot-generated" --repo "$REPO" || true

          # --- Rate limit: max 5 bot PRs/actor/day ---
          SINCE="$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          RECENT_PRS="$(gh pr list --repo "$REPO" --state open --limit 1000 \
            --json createdAt,headRefName,author)"
          COUNT="$(jq --arg actor "$ACTOR" --arg since "$SINCE" --arg pattern "$BOT_PATTERN" \
            '[.[] |
             select(.author.login == $actor) |
             select(.createdAt > $since) |
             select(.headRefName | test($pattern))] | length' <<<"$RECENT_PRS")"

          if [[ ! "$COUNT" =~ ^[0-9]+$ ]]; then
            echo "GitHub API response produced an invalid rate-limit count: $COUNT" >&2
            exit 1
          fi

          echo "Bot PRs by $ACTOR in last 24h: $COUNT"
          if (( COUNT > 5 )); then
            gh pr close "$PR_NUMBER" --repo "$REPO" \
              --comment "**Bot rate limit exceeded**: $COUNT PRs created in the last 24 hours (limit: 5/day). This PR has been automatically closed to reduce PR backlog and CI resource waste. Please consolidate related fixes."
            echo "PR #$PR_NUMBER closed: rate limit exceeded ($COUNT/5 today)"
            exit 0
          fi

          # --- Duplicate detection by title keyword ---
          KEYWORD="$(printf '%s' "$PR_TITLE" |
            sed 's/[^a-zA-Z0-9 _-]//g' |
            tr '[:upper:]' '[:lower:]' |
            cut -c1-50 |
            xargs)"
          if [[ -z "$KEYWORD" ]]; then
            echo "No keyword extracted, skipping duplicate check."
            exit 0
          fi

          DUPLICATE_PRS="$(gh pr list --repo "$REPO" --state open --limit 1000 \
            --search "$KEYWORD" --json number)"
          DUPES="$(jq --argjson current "$PR_NUMBER" \
            '[.[] | select(.number != $current)] | length' <<<"$DUPLICATE_PRS")"

          if [[ ! "$DUPES" =~ ^[0-9]+$ ]]; then
            echo "GitHub API response produced an invalid duplicate count: $DUPES" >&2
            exit 1
          fi

          echo "Similar open PRs for '$KEYWORD': $DUPES"
          if (( DUPES >= 1 )); then
            gh pr edit "$PR_NUMBER" --add-label "possible-duplicate" --repo "$REPO" || true
            gh pr comment "$PR_NUMBER" --repo "$REPO" \
              --body "**Possible duplicate**: found ${DUPES} open PR(s) with similar title ('$KEYWORD'). Check before merging." || true
          fi

  dry-run:
    name: Dry-run Governance Observation
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Observe rate-limit and duplicate policy without mutation
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ "$DRY_RUN" != "true" ]]; then
            echo "workflow_dispatch only supports dry_run=true; refusing to mutate pull requests." >&2
            exit 1
          fi

          BOT_PATTERN='^(bolt[-/]|palette-ux-|fix/web-scraper-|jules[-/])|-[0-9]{14,}$'
          SINCE="$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          OPEN_PRS="$(gh pr list --repo "$REPO" --state open --limit 1000 \
            --json number,title,createdAt,headRefName,author,headRepository)"

          jq --arg repo "$REPO" --arg since "$SINCE" --arg pattern "$BOT_PATTERN" '
            [ .[] | select(.headRepository.fullName == $repo) ] as $internal |
            [ $internal[] | select(.headRefName | test($pattern)) ] as $bot |
            [ $bot[] | select(.createdAt > $since) ] as $recent |
            {
              scanned_open_prs: length,
              internal_open_prs: ($internal | length),
              internal_bot_prs: ($bot | length),
              internal_bot_prs_last_24h: ($recent | length),
              rate_limit_window: (
                $recent
                | group_by(.author.login // "unknown")
                | map({
                    actor: (.[0].author.login // "unknown"),
                    count: length,
                    exceeds_limit: (length > 5)
                  })
              ),
              duplicate_title_groups: (
                $internal
                | map(
                    . as $pr
                    | ((.title // "")
                      | gsub("[^A-Za-z0-9 _-]"; "")
                      | ascii_downcase
                      | .[0:50]
                      | sub("^\\s+"; "")
                      | sub("\\s+$"; "")) as $keyword
                    | select($keyword != "")
                    | {keyword: $keyword, number: $pr.number}
                  )
                | group_by(.keyword)
                | map(select(length > 1) | {
                    keyword: .[0].keyword,
                    numbers: map(.number),
                    count: length
                  })
              )
            }
          ' <<<"$OPEN_PRS"

          echo "Dry-run completed: no pull request was edited, commented on, labeled, or closed."
